AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Globals:
  Function:
    Runtime: nodejs24.x

Resources:
    update:
      Type: 'AWS::Serverless::Function'
      Properties:
        CodeUri: .webpack/update
        Handler: app.handler
    delete:
      Type: 'AWS::Serverless::Function'
      Properties:
        CodeUri: .webpack/delete
        Handler: app.handler
    batchFetch:
      Type: 'AWS::Serverless::Function'
      Properties:
        CodeUri: .webpack/batchFetch
        Handler: app.handler
    create:
      Type: 'AWS::Serverless::Function'
      Properties:
        CodeUri: .webpack/create
        Handler: app.handler
    list:
      Type: 'AWS::Serverless::Function'
      Properties:
        CodeUri: .webpack/list
        Handler: app.handler
    get:
      Type: 'AWS::Serverless::Function'
      Properties:
        CodeUri: .webpack/get
        Handler: app.handler
    getPenaltyGroupPaymentRecord:
      Type: 'AWS::Serverless::Function'
      Properties:
        CodeUri: .webpack/getPenaltyGroupPaymentRecord
        Handler: app.handler
    createPenaltyGroupPaymentRecord:
      Type: 'AWS::Serverless::Function'
      Properties:
        CodeUri: .webpack/createPenaltyGroupPaymentRecord
        Handler: app.handler
    deletePenaltyGroupPaymentRecord:
      Type: 'AWS::Serverless::Function'
      Properties:
        CodeUri: .webpack/deletePenaltyGroupPaymentRecord
        Handler: app.handler
	